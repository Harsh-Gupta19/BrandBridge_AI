services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brandbridge-postgres
    environment:
      POSTGRES_DB: brandbridge
      POSTGRES_USER: brandbridge
      POSTGRES_PASSWORD: brandbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbridge -d brandbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: brandbridge-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://brandbridge:brandbridge@postgres:5432/brandbridge
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: brandbridge-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
